name: CI

on:
  push:
    branches: [ "main", "feature/**", "release/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f bot/requirements.txt ]; then pip install -r bot/requirements.txt; fi

      - name: Static checks
        run: |
          python -m pyflakes bot || true

      - name: Package backend
        run: |
          mkdir -p dist
          zip -r dist/backend.zip bot || true
        if: always()

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: dist/backend.zip
        if: always()

  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Placeholder mobile build
        run: |
          mkdir -p dist
          echo "Mobile build placeholder" > dist/mobile_build.txt

      - name: Upload mobile artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-placeholder
          path: dist/mobile_build.txt